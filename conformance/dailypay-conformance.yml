standards:
- id: jsonapi
  name: 'json:api v1.x'
  conforms: true
  evidence: >-
    All responses are application/vnd.api+json json:api documents — typed resource objects with
    id/type/attributes/relationships/links, an errors[] error envelope, filter[] query parameters
    and the include relationship-expansion parameter. The SDK page states the API "is also
    compatible with json:api client libraries".
  docs: https://developer.dailypay.com/products/rest/sdks
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    Two oauth2 securitySchemes in the OpenAPI — clientCredentials and authorizationCode — with
    tokenUrl https://auth.dailypay.com/oauth2/token. Docs state "DailyPay adheres to the OAuth 2.0
    RFC 6749 ... specification".
  docs: https://developer.dailypay.com/products/rest/guides/auth
- id: oauth2-pkce
  name: PKCE (RFC 7636)
  conforms: true
  evidence: >-
    oauth_user_token declares x-usePkce true; the OIDC discovery document advertises
    code_challenge_methods_supported [plain, S256].
- id: openid-connect
  name: OpenID Connect Core 1.0
  conforms: true
  evidence: >-
    Live discovery document at https://auth.dailypay.com/.well-known/openid-configuration with
    issuer, authorization/token/userinfo/jwks/revocation/end_session endpoints, openid scope, RS256
    id_token signing, private_key_jwt client auth, front- and back-channel logout, and signed
    request objects. Docs explicitly cite the OpenID Connect Core specification.
  docs: https://developer.dailypay.com/products/rest/guides/auth
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: >-
    www.dailypay.com and developer.dailypay.com both serve
    /.well-known/oauth-authorization-server; www.dailypay.com additionally serves
    /.well-known/oauth-protected-resource (RFC 9728) for its MCP endpoint.
- id: saml2
  name: SAML 2.0
  conforms: true
  evidence: >-
    The developer portal advertises "Flexible authentication options: OAuth, OIDC, SAML" and a
    Trust Relationship Authentication guide covering OIDC and SAML federation for Elements and
    partner integrations.
  docs: https://developer.dailypay.com/products/rest/guides/auth/trust-relationship
