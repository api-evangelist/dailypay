regulatory_context:
  domain: earned wage access / on-demand pay (United States)
  note: >-
    The API surfaces regulatory artefacts directly: a signed Wage Disclosure is a precondition for
    transfers (400 DISCLOSURE_REQUIRED) and the person's state_of_residence is required before a
    transfer can be requested (400 MISSING_STATE_OF_RESIDENCE) — both reflect state-level EWA
    disclosure regimes. DailyPay Elements are marketed as "kept up to date with the latest
    regulatory requirements for all supported jurisdictions".
