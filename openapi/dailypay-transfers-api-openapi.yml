openapi: 3.2.0
info:
  version: 3.0.0-beta.117
  termsOfService: https://www.dailypay.com/en-us/legal/direct/dailypay-client-api-terms-of-use/
  title: DailyPay Rest Transfers API
  x-logo:
    url: https://developer.dailypay.com/static/svgs/dp_text.svg
  contact:
    name: DailyPay Developer Support
    url: https://developer.dailypay.com
  description: Embed DailyPay and On Demand Pay features into your application.
servers:
- url: https://api.{environment}.com
  description: DailyPay REST API server
  variables:
    environment:
      default: dailypay
      enum:
      - dailypay
      - dailypayuat
security:
- oauth_client_credentials_token:
  - client:admin
- oauth_user_token:
  - user:read
tags:
- name: Transfers
  description: 'The _transfers_ endpoint allows you to initiate and track money movement.  You can access transfer details, including the transfer''s unique ID, amount, currency, status, schedule, submission and resolution times, fees, and related links to the involved parties.


    **Functionality** Retrieve transfer information, monitor transfer statuses, view transfer schedules, and access relevant links for the source, destination, and origin of the transfer.


    **Important** - Account origin: a user initiated movement of money from one account to another - Paycheck origin: an automatic (system-generated) movement of money as part of payroll

    '
paths:
  /rest/transfers/{transfer_id}:
    parameters:
    - $ref: '#/components/parameters/apiversion'
    - $ref: '#/components/parameters/transferIncludes'
    get:
      tags:
      - Transfers
      summary: Get a transfer object
      description: "Returns details about a transfer of money from one account to another. \n\nCreated when a person takes an advance against a future paycheck, or on a daily basis when available balance is updated based on current employment.\n"
      operationId: readTransfer
      security:
      - oauth_user_token:
        - user:read
      parameters:
      - $ref: '#/components/parameters/transfer_id'
      responses:
        '200':
          $ref: '#/components/responses/Transfer200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Unexpected'
      x-codeSamples:
      - lang: C#
        source: "using DailyPay.SDK.DotNet8;\nusing DailyPay.SDK.DotNet8.Models.Components;\nusing DailyPay.SDK.DotNet8.Models.Requests;\n\nvar sdk = new SDK(\n    version: 3,\n    security: new Security() {\n        OauthUserToken = \"<YOUR_OAUTH_USER_TOKEN_HERE>\",\n    }\n);\n\nReadTransferRequest req = new ReadTransferRequest() {\n    Include = \"estimated_funding_sources,final_funding_sources\",\n    TransferId = \"aba332a2-24a2-46de-8257-5040e71ab210\",\n};\n\nvar res = await sdk.Transfers.ReadAsync(req);\n\n// handle response"
      - lang: Java
        source: "package hello.world;\n\nimport com.dailypay.sdk.DailyPay;\nimport com.dailypay.sdk.models.components.Security;\nimport com.dailypay.sdk.models.errors.*;\nimport com.dailypay.sdk.models.operations.ReadTransferRequest;\nimport com.dailypay.sdk.models.operations.ReadTransferResponse;\nimport java.lang.Exception;\n\npublic class Application {\n\n    public static void main(String[] args) throws ErrorBadRequest, ErrorUnauthorized, ErrorForbidden, ErrorNotFound, ErrorUnexpected, Exception {\n\n        DailyPay sdk = DailyPay.builder()\n                .version(3L)\n                .security(Security.builder()\n                    .oauthUserToken(System.getenv().getOrDefault(\"OAUTH_USER_TOKEN\", \"\"))\n                    .build())\n            .build();\n\n        ReadTransferRequest req = ReadTransferRequest.builder()\n                .transferId(\"aba332a2-24a2-46de-8257-5040e71ab210\")\n                .include(\"estimated_funding_sources,final_funding_sources\")\n                .build();\n\n        ReadTransferResponse res = sdk.transfers().read()\n                .request(req)\n                .call();\n\n        if (res.transferData().isPresent()) {\n            System.out.println(res.transferData().get());\n        }\n    }\n}"
      - lang: Go
        source: "package main\n\nimport(\n\t\"context\"\n\t\"github.com/dailypay/dailypay-go-sdk/models/components\"\n\tdailypay \"github.com/dailypay/dailypay-go-sdk\"\n\t\"github.com/dailypay/dailypay-go-sdk/models/operations\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := dailypay.New(\n        dailypay.WithVersion(3),\n        dailypay.WithSecurity(components.Security{\n            OauthUserToken: dailypay.Pointer(\"<YOUR_OAUTH_USER_TOKEN_HERE>\"),\n        }),\n    )\n\n    res, err := s.Transfers.Read(ctx, operations.ReadTransferRequest{\n        Include: dailypay.Pointer(\"estimated_funding_sources,final_funding_sources\"),\n        TransferID: \"aba332a2-24a2-46de-8257-5040e71ab210\",\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.TransferData != nil {\n        // handle response\n    }\n}"
      - lang: JavaScript
        source: "import { SDK } from \"@dailypay/dailypay\";\n\nconst sdk = new SDK({\n  version: 3,\n  security: {\n    oauthUserToken: \"<YOUR_OAUTH_USER_TOKEN_HERE>\",\n  },\n});\n\nasync function run() {\n  const result = await sdk.transfers.read({\n    include: \"estimated_funding_sources,final_funding_sources\",\n    transferId: \"aba332a2-24a2-46de-8257-5040e71ab210\",\n  });\n\n  console.log(result);\n}\n\nrun();"
