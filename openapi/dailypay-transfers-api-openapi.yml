    post:
      tags:
      - Transfers
      summary: Request a transfer
      description: 'Request transfer of funds from an `EARNINGS_BALANCE` account to a

        personal `DEPOSITORY` or `CARD` account.

        '
      operationId: createTransfer
      security:
      - oauth_user_token:
        - user:read_write
      x-speakeasy-usage-example:
        title: Request a transfer
        description: Initiate a transfer of funds from an earnings balance account to a personal depository or card account.
        position: 2
      parameters:
      - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        $ref: '#/components/requestBodies/TransferCreate'
      responses:
        '200':
          $ref: '#/components/responses/Transfer200'
        '400':
          $ref: '#/components/responses/TransferCreate400'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Unexpected'
      x-codeSamples:
      - lang: C#
        source: "using DailyPay.SDK.DotNet8;\nusing DailyPay.SDK.DotNet8.Models.Components;\nusing DailyPay.SDK.DotNet8.Models.Requests;\n\nvar sdk = new SDK(\n    version: 3,\n    security: new Security() {\n        OauthUserToken = \"<YOUR_OAUTH_USER_TOKEN_HERE>\",\n    }\n);\n\nCreateTransferRequest req = new CreateTransferRequest() {\n    Include = \"estimated_funding_sources,final_funding_sources\",\n    IdempotencyKey = \"e2736aa1-78c4-4cc6-b0a6-848e733f232a\",\n    TransferCreateData = new TransferCreateData() {\n        Data = new TransferCreateResource() {\n            Attributes = new TransferCreateAttributes() {\n                Preview = true,\n                Amount = 15000,\n                Currency = \"USD\",\n                Schedule = TransferCreateAttributesSchedule.WithinThirtyMinutes,\n            },\n            Relationships = new TransferCreateRelationships() {\n                Origin = new AccountRelationship() {\n                    Data = new AccountIdentifier() {\n                        Id = \"123e4567-e89b-12d3-a456-426614174000\",\n                    },\n                },\n                Destination = new AccountRelationship() {\n                    Data = new AccountIdentifier() {\n                        Id = \"223e4567-e89b-12d3-a456-426614174001\",\n                    },\n                },\n                Person = new PersonRelationship() {\n                    Data = new PersonIdentifier() {\n                        Id = \"aa860051-c411-4709-9685-c1b716df611b\",\n                    },\n                },\n            },\n        },\n    },\n};\n\nvar res = await sdk.Transfers.CreateAsync(req);\n\n// handle response"
      - lang: Java
        source: "package hello.world;\n\nimport com.dailypay.sdk.DailyPay;\nimport com.dailypay.sdk.models.components.*;\nimport com.dailypay.sdk.models.errors.*;\nimport com.dailypay.sdk.models.operations.CreateTransferRequest;\nimport com.dailypay.sdk.models.operations.CreateTransferResponse;\nimport java.lang.Exception;\n\npublic class Application {\n\n    public static void main(String[] args) throws TransferCreateError, ErrorUnauthorized, ErrorForbidden, ErrorConflict, ErrorUnexpected, Exception {\n\n        DailyPay sdk = DailyPay.builder()\n                .version(3L)\n                .security(Security.builder()\n                    .oauthUserToken(System.getenv().getOrDefault(\"OAUTH_USER_TOKEN\", \"\"))\n                    .build())\n            .build();\n\n        CreateTransferRequest req = CreateTransferRequest.builder()\n                .idempotencyKey(\"e2736aa1-78c4-4cc6-b0a6-848e733f232a\")\n                .transferCreateData(TransferCreateData.builder()\n                    .data(TransferCreateResource.builder()\n                        .attributes(TransferCreateAttributes.builder()\n                            .amount(15000L)\n                            .currency(\"USD\")\n                            .schedule(TransferCreateAttributesSchedule.WITHIN_THIRTY_MINUTES)\n                            .preview(true)\n                            .build())\n                        .relationships(TransferCreateRelationships.builder()\n                            .origin(AccountRelationship.builder()\n                                .data(AccountIdentifier.builder()\n                                    .id(\"123e4567-e89b-12d3-a456-426614174000\")\n                                    .build())\n                                .build())\n                            .destination(AccountRelationship.builder()\n                                .data(AccountIdentifier.builder()\n                                    .id(\"223e4567-e89b-12d3-a456-426614174001\")\n                                    .build())\n                                .build())\n                            .person(PersonRelationship.builder()\n                                .data(PersonIdentifier.builder()\n                                    .id(\"aa860051-c411-4709-9685-c1b716df611b\")\n                                    .build())\n                                .build())\n                            .build())\n                        .build())\n                    .build())\n                .include(\"estimated_funding_sources,final_funding_sources\")\n                .build();\n\n        CreateTransferResponse res = sdk.transfers().create()\n                .request(req)\n                .call();\n\n        if (res.transferData().isPresent()) {\n            System.out.println(res.transferData().get());\n        }\n    }\n}"
      - lang: Go
        source: "package main\n\nimport(\n\t\"context\"\n\t\"github.com/dailypay/dailypay-go-sdk/models/components\"\n\tdailypay \"github.com/dailypay/dailypay-go-sdk\"\n\t\"github.com/dailypay/dailypay-go-sdk/models/operations\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := dailypay.New(\n        dailypay.WithVersion(3),\n        dailypay.WithSecurity(components.Security{\n            OauthUserToken: dailypay.Pointer(\"<YOUR_OAUTH_USER_TOKEN_HERE>\"),\n        }),\n    )\n\n    res, err := s.Transfers.Create(ctx, operations.CreateTransferRequest{\n        Include: dailypay.Pointer(\"estimated_funding_sources,final_funding_sources\"),\n        IdempotencyKey: \"e2736aa1-78c4-4cc6-b0a6-848e733f232a\",\n        TransferCreateData: components.TransferCreateData{\n            Data: components.TransferCreateResource{\n                Attributes: components.TransferCreateAttributes{\n                    Preview: dailypay.Pointer(true),\n                    Amount: 15000,\n                    Currency: \"USD\",\n                    Schedule: components.TransferCreateAttributesScheduleWithinThirtyMinutes,\n                },\n                Relationships: components.TransferCreateRelationships{\n                    Origin: components.AccountRelationship{\n                        Data: components.AccountIdentifier{\n                            ID: \"123e4567-e89b-12d3-a456-426614174000\",\n                        },\n                    },\n                    Destination: &components.AccountRelationship{\n                        Data: components.AccountIdentifier{\n                            ID: \"223e4567-e89b-12d3-a456-426614174001\",\n                        },\n                    },\n                    Person: &components.PersonRelationship{\n                        Data: components.PersonIdentifier{\n                            ID: \"aa860051-c411-4709-9685-c1b716df611b\",\n                        },\n                    },\n                },\n            },\n        },\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.TransferData != nil {\n        // handle response\n    }\n}"
