        source: "using DailyPay.SDK.DotNet9;\nusing DailyPay.SDK.DotNet9.Models.Requests;\n\nvar sdk = new SDK();\n\nCreateGenericCardTokenRequest req = new CreateGenericCardTokenRequest() {\n    FirstName = \"Edith\",\n    LastName = \"Clarke\",\n    CardNumber = \"4007589999999912\",\n    ExpirationYear = \"2027\",\n    ExpirationMonth = \"02\",\n    Cvv = \"123\",\n    AddressLineOne = \"123 Kebly Street\",\n    AddressLineTwo = \"Unit C\",\n    AddressCity = \"Fort Lee\",\n    AddressState = \"NJ\",\n    AddressZipCode = \"07237\",\n    AddressCountry = \"US\",\n};\n\nvar res = await sdk.CardTokenization.CreateAsync(req);\n\n// handle response"
      - lang: java
        label: createGenericCardToken
        source: "package hello.world;\n\nimport com.dailypay.sdk.DailyPay;\nimport com.dailypay.sdk.models.operations.CreateGenericCardTokenRequest;\nimport com.dailypay.sdk.models.operations.CreateGenericCardTokenResponse;\nimport java.lang.Exception;\n\npublic class Application {\n\n    public static void main(String[] args) throws Exception {\n\n        DailyPay sdk = DailyPay.builder()\n            .build();\n\n        CreateGenericCardTokenRequest req = CreateGenericCardTokenRequest.builder()\n                .firstName(\"Edith\")\n                .lastName(\"Clarke\")\n                .cardNumber(\"4007589999999912\")\n                .expirationYear(\"2027\")\n                .expirationMonth(\"02\")\n                .addressLineOne(\"123 Kebly Street\")\n                .addressCity(\"Fort Lee\")\n                .addressState(\"NJ\")\n                .addressZipCode(\"07237\")\n                .addressCountry(\"US\")\n                .cvv(\"123\")\n                .addressLineTwo(\"Unit C\")\n                .build();\n\n        CreateGenericCardTokenResponse res = sdk.cards().create()\n                .request(req)\n                .call();\n\n        if (res.object().isPresent()) {\n            // handle response\n        }\n    }\n}"
components:
  securitySchemes:
    oauth_client_credentials_token:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.dailypay.com/oauth2/token
          scopes:
            client:lookup: Read access to resources necessary to find a person by known identifiers.
    oauth_user_token:
      type: oauth2
      flows:
        authorizationCode:
          x-usePkce: true
          authorizationUrl: https://auth.dailypay.com/oauth2/auth
          tokenUrl: https://auth.dailypay.com/oauth2/token
          scopes:
            user:read: Read access to all relevant objects for a non-application user,  including accounts, jobs, people, transfers, and paychecks.
            user:read_write: Read and write access to all relevant objects for a non-application user, including accounts, jobs, people, transfers, and paychecks.
x-speakeasy-name-override:
- operationId: ^read*
  methodNameOverride: read
- operationId: ^list*
  methodNameOverride: list
- operationId: ^create*
  methodNameOverride: create
- operationId: ^update*
  methodNameOverride: update
x-speakeasy-globals:
  parameters:
  - $ref: '#/components/parameters/apiversion'
x-speakeasy-retries:
  strategy: backoff
  backoff:
    initialInterval: 500
    maxElapsedTime: 30000
    exponent: 1.25
  statusCodes:
  - 408
  - 409
  - 5XX
  retryConnectionErrors: true
x-tagGroups:
- name: Documentation
  tags:
  - API Status
  - Environments
  - Filtering
  - Idempotency
  - Versioning
- name: Core Resources
  tags:
  - Accounts
  - Health
  - Jobs
  - Organizations
  - Paychecks
  - People
  - Transfers
- name: Payments API
  tags:
  - Card Tokenization
