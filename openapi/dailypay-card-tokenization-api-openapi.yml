      x-codeSamples:
      - lang: C#
        source: "using DailyPay.SDK.DotNet8;\nusing DailyPay.SDK.DotNet8.Models.Requests;\n\nvar sdk = new SDK();\n\nCreateGenericCardTokenRequest req = new CreateGenericCardTokenRequest() {\n    FirstName = \"Edith\",\n    LastName = \"Clarke\",\n    CardNumber = \"4007589999999912\",\n    ExpirationYear = \"2027\",\n    ExpirationMonth = \"02\",\n    Cvv = \"123\",\n    AddressLineOne = \"123 Kebly Street\",\n    AddressLineTwo = \"Unit C\",\n    AddressCity = \"Fort Lee\",\n    AddressState = \"NJ\",\n    AddressZipCode = \"07237\",\n    AddressCountry = \"US\",\n};\n\nvar res = await sdk.CardTokenization.CreateAsync(req);\n\n// handle response"
      - lang: Java
        source: "package hello.world;\n\nimport com.dailypay.sdk.DailyPay;\nimport com.dailypay.sdk.models.operations.CreateGenericCardTokenRequest;\nimport com.dailypay.sdk.models.operations.CreateGenericCardTokenResponse;\nimport java.lang.Exception;\n\npublic class Application {\n\n    public static void main(String[] args) throws Exception {\n\n        DailyPay sdk = DailyPay.builder()\n            .build();\n\n        CreateGenericCardTokenRequest req = CreateGenericCardTokenRequest.builder()\n                .firstName(\"Edith\")\n                .lastName(\"Clarke\")\n                .cardNumber(\"4007589999999912\")\n                .expirationYear(\"2027\")\n                .expirationMonth(\"02\")\n                .addressLineOne(\"123 Kebly Street\")\n                .addressCity(\"Fort Lee\")\n                .addressState(\"NJ\")\n                .addressZipCode(\"07237\")\n                .addressCountry(\"US\")\n                .cvv(\"123\")\n                .addressLineTwo(\"Unit C\")\n                .build();\n\n        CreateGenericCardTokenResponse res = sdk.cardTokenization().create()\n                .request(req)\n                .call();\n\n        if (res.object().isPresent()) {\n            System.out.println(res.object().get());\n        }\n    }\n}"
      - lang: Go
        source: "package main\n\nimport(\n\t\"context\"\n\tdailypay \"github.com/dailypay/dailypay-go-sdk\"\n\t\"github.com/dailypay/dailypay-go-sdk/models/operations\"\n\t\"log\"\n)\n\nfunc main() {\n    ctx := context.Background()\n\n    s := dailypay.New()\n\n    res, err := s.CardTokenization.Create(ctx, operations.CreateGenericCardTokenRequest{\n        FirstName: \"Edith\",\n        LastName: \"Clarke\",\n        CardNumber: \"4007589999999912\",\n        ExpirationYear: \"2027\",\n        ExpirationMonth: \"02\",\n        Cvv: dailypay.Pointer(\"123\"),\n        AddressLineOne: \"123 Kebly Street\",\n        AddressLineTwo: dailypay.Pointer(\"Unit C\"),\n        AddressCity: \"Fort Lee\",\n        AddressState: \"NJ\",\n        AddressZipCode: \"07237\",\n        AddressCountry: \"US\",\n    })\n    if err != nil {\n        log.Fatal(err)\n    }\n    if res.Object != nil {\n        // handle response\n    }\n}"
      - lang: JavaScript
        source: "import { SDK } from \"@dailypay/dailypay\";\n\nconst sdk = new SDK();\n\nasync function run() {\n  const result = await sdk.cardTokenization.create({\n    firstName: \"Edith\",\n    lastName: \"Clarke\",\n    cardNumber: \"4007589999999912\",\n    expirationYear: \"2027\",\n    expirationMonth: \"02\",\n    cvv: \"123\",\n    addressLineOne: \"123 Kebly Street\",\n    addressLineTwo: \"Unit C\",\n    addressCity: \"Fort Lee\",\n    addressState: \"NJ\",\n    addressZipCode: \"07237\",\n    addressCountry: \"US\",\n  });\n\n  console.log(result);\n}\n\nrun();"
