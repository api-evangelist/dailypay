statement: >-
  "DailyPay adheres to the OAuth 2.0 RFC 6749 and OpenID Connect specifications." Two token
  acquisition paths are supported: authorization code (when the operation acts on behalf of an
  employee and requires their consent) and client credentials (for server-to-server operations such
  as reading connected employer organizations).
