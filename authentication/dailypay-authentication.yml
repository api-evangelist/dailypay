onboarding:
  self_serve: false
  process: >-
    A DailyPay contact registers the application. The partner supplies a callback URL for the
    authorization-code flow, links to its privacy policy and terms of service, and optionally a
    logo for the consent screen and a JWKS for signed OIDC requests. DailyPay returns client_id,
    client_secret (when applicable), the permitted scope list, and the registered redirect_uri.
  registration_page: https://www.dailypay.com/developer/
