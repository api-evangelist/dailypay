core_flow: An organization employs a person; the person holds one or more jobs; a job produces paychecks;
  a paycheck credits the person's EARNINGS_BALANCE account; a transfer moves value from that EARNINGS_BALANCE
  account (origin) to a DEPOSITORY or CARD account (destination), funded by one or more paychecks recorded
  as funding sources.
