aid: dailypay
name: DailyPay
description: 'DailyPay is an on-demand pay (earned wage access) platform that lets
  employees access wages they have already earned before the scheduled payday. The
  company sells to employers across healthcare, retail, restaurants, manufacturing,
  hospitality and the public sector, and integrates with 180+ HCM, payroll and time-management
  systems. Its developer surface — the DailyPay REST API — is a json:api-shaped OAuth
  2.0 / OpenID Connect API covering people, jobs, organizations, paychecks, accounts
  (including the EARNINGS_BALANCE account that carries available earnings), transfers
  and PCI-scoped debit-card tokenization, complemented by DailyPay Elements, a set
  of hosted drop-in iframe components for embedding on-demand pay into partner applications.'
