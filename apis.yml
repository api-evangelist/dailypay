apis:
- aid: dailypay:dailypay-rest-api
  name: DailyPay Rest API
  description: >-
    Embed DailyPay and On Demand Pay features into your application. A json:api-compliant
    REST API covering jobs, accounts, transfers, paychecks, organizations, people and
    debit-card tokenization, secured with OAuth 2.0 client-credentials and authorization-code
    (PKCE) flows, versioned by the DailyPay-API-Version header and requiring an
    Idempotency-Key on transfer creation.
