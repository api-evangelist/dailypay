- aid: dailypay:dailypay-transfers-api
  name: DailyPay Transfers API
  description: >-
    The _transfers_ endpoint allows you to initiate and track money movement.  You can access transfer
    details, including the transfer's unique ID, amount, currency, status, schedule, submission and resolution
    times, fees, and related links to the involved parties.


    **Functionality** Retrieve transfer information, monitor transfer statuses, view transfer schedules,
    and access relevant links for the source, destination, and origin of the transfer.


    **Important** - Account origin: a user initiated movement of money from one account to another - Paycheck
    origin: an automatic (system-generated) movement of money as part of payroll
  humanURL: https://developer.dailypay.com/products/rest/reference
  baseURL: https://api.dailypay.com/rest
