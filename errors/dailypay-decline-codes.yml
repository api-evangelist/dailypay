description: Money-movement rejection codes for the DailyPay REST API. DailyPay is not a card acquirer,
  so these are not card-network decline codes; they are the reasons an earned-wage-access transfer or
  a funding-account creation is refused. Returned on HTTP 400 in the json:api errors[].code field.
envelope_field: errors[].code
http_status: 400
open_enum: true
masked_to_end_user: unspecified — DailyPay documents detail as non-programmatic and subject to change;
  surface code, not detail, to users
