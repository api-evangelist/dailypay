notes: >-
  DailyPay publishes four official, Speakeasy-generated client SDKs from the DailyPay REST OpenAPI,
  plus a fifth (Java) that the SDK page states is available to select partners only and is not
  published in the public GitHub org. Notably, none of the public SDKs are distributed through a
  language package registry — npm, NuGet, pkg.go.dev and Maven Central were all probed and the
  install path documented in every README is a direct Git/GitHub reference. The `dailypay` name on
  npm is an unrelated security-holding placeholder (0.0.1-security), not a DailyPay package.
  DailyPay also documents that, for unsupported languages, the API is compatible with generic
  json:api client libraries.
packages:
- language: typescript
  registry: github
  name: '@dailypay/dailypay'
  url: https://github.com/dailypay/dailypay-typescript-sdk
  install: npm add https://github.com/dailypay/dailypay-typescript-sdk
  official: true
  generator: speakeasy
  license: MIT
  notes: >-
    Node.js and browser; includes React hooks via TanStack Query and standalone tree-shakable
    functions. Not published to the npm registry — installed from the Git URL.
- language: go
  registry: github
  name: github.com/dailypay/dailypay-go-sdk
  url: https://github.com/dailypay/dailypay-go-sdk
